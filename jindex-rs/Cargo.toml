[package]
name = "jindex-rs"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ascii = "1.0.0"
rustc-hash = "1.1.0"
anyhow = "1.0.57"
jni = "0.22.4"
jvmti-bindings = "=3.0.2"
speedy = "0.8.0"
zip = { version = "0.6.2", features = ["deflate", "zstd"], default-features = false }
once_cell = "1.16.0"
atomic_refcell = "0.1.8"
mimalloc = { version = "=0.1.52", default-features = false }
rayon = "1.6.0"
compact_str = "0.6.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
debug = true
