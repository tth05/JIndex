plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.tth05'
version = providers.gradleProperty('jindexVersion').orElse('1.1.0-SNAPSHOT').get()

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.github.classgraph:classgraph:4.8.193'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
    }
}

tasks.register('benchmarkInitialIndex', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.tth05.jindex.InitialIndexBenchmark'
}

tasks.register('benchmarkRuntimeCorpus', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.tth05.jindex.RuntimeCorpusBenchmark'

    def benchmarkManifest = providers.gradleProperty('benchmarkManifest')
    def benchmarkOutput = providers.gradleProperty('benchmarkOutput')
    doFirst {
        args benchmarkManifest.get(), benchmarkOutput.get()
    }
}

def rustProjectDirectory = file("${projectDir}/jindex-rs")
def nativeLibrary = file("${rustProjectDirectory}/target/release/jindex_rs.dll")
def generatedNativeResources = layout.buildDirectory.dir('generated-resources/jindex')

tasks.register('buildNativeLibrary', Exec) {
    inputs.files(fileTree(rustProjectDirectory) {
        include 'src/**'
        include 'Cargo.toml'
        include 'Cargo.lock'
        include 'rust-toolchain.toml'
    })
    outputs.file(nativeLibrary)

    workingDir "${projectDir}/jindex-rs"
    commandLine 'cargo', 'build', '--release', '--locked'
}

tasks.register('checkNativeFormatting', Exec) {
    workingDir rustProjectDirectory
    commandLine 'cargo', 'fmt', '--all', '--', '--check'
}

tasks.register('testNativeLibrary', Exec) {
    dependsOn tasks.named('buildNativeLibrary')
    workingDir rustProjectDirectory
    commandLine 'cargo', 'test', '--all-targets', '--locked'
}

tasks.register('checkNativeLints', Exec) {
    workingDir rustProjectDirectory
    commandLine 'cargo', 'clippy', '--all-targets', '--locked', '--', '-D', 'warnings'
}

tasks.named('check') {
    dependsOn tasks.named('checkNativeFormatting'), tasks.named('checkNativeLints'), tasks.named('testNativeLibrary')
}

tasks.register('stageNativeLibrary', Sync) {
    dependsOn tasks.named('buildNativeLibrary')
    from nativeLibrary
    into generatedNativeResources.map { it.dir('jindex_natives') }
}

tasks.named('processResources') {
    dependsOn tasks.named('stageNativeLibrary')
    from generatedNativeResources
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "https://packagecloud.io/tth05/repo/java/maven2/"
            credentials {
                username = System.getenv("PACKAGECLOUD_TOKEN")
                password = ""
            }
        }
    }
}
