plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.tth05'
var ver = System.getenv("GITHUB_REF") ?: "dev"
version = ver.replaceAll("^refs/tags/v", "")

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.github.classgraph:classgraph:4.8.193'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
    }
}
def rustProjectDirectory = file("${projectDir}/jindex-rs")
def nativeLibrary = file("${rustProjectDirectory}/target/release/jindex_rs.dll")
def generatedNativeResources = layout.buildDirectory.dir('generated-resources/jindex')

tasks.register('buildNativeLibrary', Exec) {
    inputs.files(fileTree(rustProjectDirectory) {
        include 'src/**'
        include 'Cargo.toml'
        include 'Cargo.lock'
        include 'rust-toolchain.toml'
    })
    outputs.file(nativeLibrary)

    workingDir "${projectDir}/jindex-rs"
    commandLine 'cargo', 'build', '--release', '--locked'
}

tasks.register('stageNativeLibrary', Sync) {
    dependsOn tasks.named('buildNativeLibrary')
    from nativeLibrary
    into generatedNativeResources.map { it.dir('jindex_natives') }
}

tasks.named('processResources') {
    dependsOn tasks.named('stageNativeLibrary')
    from generatedNativeResources
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "https://packagecloud.io/tth05/repo/java/maven2/"
            credentials {
                username = System.getenv("PACKAGECLOUD_TOKEN")
                password = ""
            }
        }
    }
}
