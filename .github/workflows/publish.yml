name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_publish:
    name: Publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build with Gradle
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          ./gradlew.bat --no-daemon clean build publish "-PjindexVersion=$releaseVersion"
